[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoprep"
version = "0.2.0"
description = "Modular geospatial preprocessing library that turns raw Sentinel-1/Sentinel-2 imagery into AI-ready tensors for Vision Transformers, Temporal Transformers, and Graph Neural Networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Dhruv Kapoor" }
]
keywords = [
    "remote-sensing",
    "geospatial",
    "sentinel-2",
    "sentinel-1",
    "earth-observation",
    "agriculture",
    "vision-transformer",
    "graph-neural-network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
    "xarray>=2023.1",
    "rioxarray>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Repository = "https://github.com/<your-username>/geoprep"
Changelog = "https://github.com/<your-username>/geoprep/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
